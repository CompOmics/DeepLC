[project]
name = "deeplc"
version = "4.0.0-dev1"
description = "DeepLC: Retention time prediction for (modified) peptides using Deep Learning."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Robbin Bouwmeester", email = "robbin.bouwmeester@ugent.be" },
    { name = "Niels Hulstaert" },
    { name = "Arthur Declercq" },
    { name = "Ralf Gabriels" },
    { name = "Alireza Nameni" },
    { name = "Lennart Martens" },
    { name = "Sven Degroeve" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Development Status :: 5 - Production/Stable",
]
requires-python = ">=3.11"
keywords = [
    "DeepLC",
    "Proteomics",
    "deep learning",
    "peptides",
    "retention time",
    "prediction",
]

dependencies = [
    "torch>=2.6.0,<3",
    "numpy>=1.17",
    "pandas>=0.25",
    "scikit-learn>=1.2.0",
    "psm_utils>=0.2.3",
    "onnx2torch>=1.5.15",  # Required as long as models are shipped in ONNX format
]


[project.scripts]
deeplc = "deeplc.__main__:main"
deeplc-gui = "deeplc.gui:start_gui"

[project.urls]
GitHub = "https://github.com/compomics/deeplc"
PyPi = "https://pypi.org/project/deeplc/"
CompOmics = "https://www.compomics.com"

[dependency-groups]
dev = ["ruff", "pytest"]
notebooks = ["ipykernel", "ipywidgets", "matplotlib", "seaborn"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deeplc"]
include-package-data = true

[tool.ruff]
line-length = 99
target-version = 'py311'

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.format]
docstring-code-format = true
